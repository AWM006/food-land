<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../bootstrap-5.3.8-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./style.css">
    <title>Document</title>
</head>
<body>
    <div id="main">
        <form>
            <div class="form-row">
              <div class="col">
                 <label for="first">First Name</label>
                <input required type="text" class="form-control" id="first" placeholder="First name" style="border: 1px solid black;">
              </div>
              <div class="col">
                 <label for="last">Last Name</label>
                <input required type="text" class="form-control" id="last" placeholder="Last name" style="border: 1px solid black;">
              </div>
            </div>
            <div class="form-row">
                <div class="form-group col-md-6">
                  <label for="inputEmail4">Phone</label>
                  <input required type="number" class="form-control" id="inputEmail4" placeholder="Phone" style="border: 1px solid black;">
                </div>
                <div class="form-group col-md-6">
                  <label for="inputPassword4">Password</label>
                  <input required type="password" class="form-control" id="inputPassword4" placeholder="Password" style="border: 1px solid black;">
                </div>
            </div>
            <div class="form-group">
                <label for="inputAddress">Address</label>
                <input required type="text" class="form-control" id="inputAddress" placeholder="1234 Main St" style="border: 1px solid black;">
            </div>
            <div class="form-row">
                <div class="form-group col-md-2">
                  <label for="inputZip">Pincode</label>
                  <input required type="number" class="form-control" id="inputZip" style="border: 1px solid black;">
                </div>
            </div>
            <div class="form-group">
            </div>
            <button type="submit" class="btn btn-primary" id="submit">Sign in</button>
        </form>
    </div>

    <script src="../bootstrap-5.3.8-dist/js/bootstrap.min.js"></script>
</body>
</html>
