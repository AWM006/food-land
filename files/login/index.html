<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../bootstrap-5.3.8-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./style.css">
    <title>Document</title>
</head>
<body>
    
    <!-- Section: Design Block -->
<section class=" text-center text-lg-start">

    <div id="main" class="d-flex justify-content-center align-items-center bg-light d-lg-none" style="height: 80px;">
        <img src="../photos/logo.png" alt="Logo" class="img-fluid" style="height: 60px;">
    </div>

  <div class="card mb-3">
    <div class="row g-0 d-flex align-items-center">
      <div class="col-lg-4 d-none d-lg-flex">
        <img src="https://mdbootstrap.com/img/new/ecommerce/vertical/004.jpg" alt="Trendy Pants and Shoes"
          class="w-100 rounded-t-5 rounded-tr-lg-0 rounded-bl-lg-5" />
      </div>
      <div class="col-lg-8">
        <div class="card-body py-5 px-md-5">

          <form>
            <div data-mdb-input-init class="form-outline mb-4">
              <input required type="number" id="form2Example1" class="form-control" style="border: 1px solid black;" />
              <label class="form-label" for="form2Example1">Phone Number</Nav></label>
            </div>

            <div data-mdb-input-init class="form-outline mb-4">
              <input required type="password" id="form2Example2" class="form-control" style="border: 1px solid black;"/>
              <label class="form-label" for="form2Example2">Password</label>
            </div>

            <div class="row mb-4">
              <div class="col d-flex justify-content-center">
                <a href="#!">Forgot password?</a>
              </div>
            </div>
            <button  type="button" data-mdb-button-init data-mdb-ripple-init class="btn btn-primary btn-block mb-4">Sign in</button>

          </form>

        </div>
      </div>
    </div>
  </div>
</section>


    <script src="../bootstrap-5.3.8-dist/js/bootstrap.min.js"></script>
</body>
</html>
